[package]
name = "stratum-dsp"
version = "1.0.0"
edition = "2021"
authors = ["HLLMR"]
description = "Professional-grade audio analysis engine for DJ applications: BPM detection, key detection, and beat tracking"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HLLMR/stratum-dsp"
keywords = ["audio", "dsp", "bpm", "key-detection", "beat-tracking"]
categories = ["multimedia::audio"]
readme = "README.md"

[dependencies]
# Math & DSP
rustfft = "6.2"

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rayon = "1.8"

[dev-dependencies]
# Audio I/O for example CLIs
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "all-meta",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }
env_logger = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }
hound = "3.5"  # WAV file reading for integration tests

[features]
default = []
# Phase 2 ML integration point. Kept dependency-free while ML modules are stubs.
ml = []
# Backward-compatible alias for callers that enabled the old implicit optional-dependency feature.
ort = []

[package.metadata.docs.rs]
features = ["default"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "stratum_dsp"
path = "src/lib.rs"

[[bench]]
name = "audio_analysis_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
